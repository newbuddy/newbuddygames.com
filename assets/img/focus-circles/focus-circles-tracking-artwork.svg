<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t">
  <title id="t">Focus Circles artwork: identical balls shuffle along dashed paths while one target ball is marked with a focus ring</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2B2178"/>
      <stop offset="1" stop-color="#110C2C"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#DCD6FF"/>
      <stop offset="1" stop-color="#9A8CF0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#7C6CFF" stroke-opacity=".16" stroke-width="2">
    <circle cx="200" cy="200" r="168"/>
    <circle cx="200" cy="200" r="118"/>
  </g>
  <!-- shuffle paths -->
  <g fill="none" stroke="#FF7A9C" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 11" opacity=".9">
    <path d="M118 128 C170 70 250 82 282 130"/>
    <path d="M300 238 C288 300 222 330 168 304"/>
    <path d="M100 252 C70 210 78 168 112 140"/>
  </g>
  <g fill="url(#ball)">
    <circle cx="112" cy="132" r="30"/>
    <circle cx="288" cy="134" r="30"/>
    <circle cx="300" cy="250" r="30"/>
    <circle cx="104" cy="262" r="30"/>
  </g>
  <!-- target -->
  <circle cx="200" cy="300" r="30" fill="url(#ball)"/>
  <g fill="none" stroke="#39E0C1" stroke-width="5" stroke-linecap="round">
    <circle cx="200" cy="300" r="46"/>
    <path d="M200 238v-12M200 362v12M138 300h-12M262 300h12"/>
  </g>
</svg>

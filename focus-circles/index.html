<style>
  :root { --fc-bg: #120E2E; --violet: #7C6CFF; --mint: #39E0C1; --coral: #FF7A9C; }
  body { background: var(--fc-bg); }
  .site-header.solid { background: rgba(18, 14, 46, 0.8); border-color: rgba(124, 108, 255, 0.2); }
  .brand b { color: var(--mint); }
  .stage { position: relative; min-height: calc(100vh - 62px); display: grid; place-items: center; overflow: hidden; padding: 48px var(--gutter) 64px;
           background: radial-gradient(70vmin 70vmin at 50% 45%, rgba(124, 108, 255, 0.28), transparent 70%); }
  .rings { position: absolute; left: 50%; top: 45%; width: min(118vmin, 980px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
  .rings circle { fill: none; stroke-linecap: round; transform-origin: 300px 300px; }
  .rings .track { stroke-width: 2; opacity: 0.22; }
  .rings .arc { stroke-width: 7; filter: drop-shadow(0 0 10px currentColor); }
  .r1 { color: var(--violet); stroke: var(--violet); animation: spin 22s linear infinite; }
  .r2 { color: var(--mint); stroke: var(--mint); animation: spin 15s linear infinite reverse; }
  .r3 { color: var(--coral); stroke: var(--coral); animation: spin 9s linear infinite; }
  .core { fill: #fff; animation: breathe 4s ease-in-out infinite; transform-origin: 300px 300px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.18); } }
  .copy { position: relative; z-index: 2; text-align: center; display: grid; justify-items: center; gap: 18px; margin-top: 34vmin; }
  .badge { padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--fc-bg); background: var(--mint); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(60px, 11vw, 150px); line-height: 0.9; letter-spacing: -0.02em; margin: 0; text-shadow: 0 6px 40px rgba(18, 14, 46, 0.9); }
  h1 em { color: var(--mint); }
  .copy p { margin: 0; max-width: 46ch; color: #D6D0FF; font-size: clamp(17px, 1.8vw, 20px); }
  .copy .arrow-list { margin-top: 10px; justify-items: center; }
  .copy .arrow-list a:hover { color: var(--mint); }
  .site-footer { border-color: rgba(124, 108, 255, 0.2); }
  @media (max-width: 600px) { .rings { opacity: 0.6; } .copy p { text-shadow: 0 2px 12px var(--fc-bg); } }
